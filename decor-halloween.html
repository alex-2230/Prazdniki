<body class="h">

<main>

<section class="band" style="padding-top: clamp(3rem, 7vw, 5rem);">
  <div class="wrap">
    <p class="date-stamp">Оформление дома</p>
    <h1>Шесть идей для хэллоуинского декора</h1>
    <p class="lede">От крыльца до каминной полки — не обязательно делать всё сразу, достаточно одной-двух идей, чтобы дом почувствовал вечер.</p>

    <div class="decor-grid">

      <figure class="decor-card">
        <img src="decor-h-porch.jpg" alt="Крыльцо дома, украшенное резными тыквами и гирляндой" loading="lazy">
        <figcaption>
          <h3>Крыльцо и вход</h3>
          <p>Пара тыкв у двери и тёплая гирлянда над крыльцом работают лучше десятка мелких деталей — оформление видно уже с улицы.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="decor-h-table.jpg" alt="Праздничный стол с резной тыквой в центре и свечами" loading="lazy">
        <figcaption>
          <h3>Праздничный стол</h3>
          <p>Тёмная скатерть под приборы и одна крупная тыква в центре стола — любые оранжевые детали на таком фоне сразу читаются как тематические.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="decor-h-window.jpg" alt="Светящаяся резная тыква на подоконнике ночью" loading="lazy">
        <figcaption>
          <h3>Светильник у окна</h3>
          <p>Один вырезанный фонарь на подоконнике, снятый в темноте, даёт больше атмосферы, чем гирлянда пластиковых украшений.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="decor-h-garland.jpg" alt="Гирлянда с лампочками в форме тыкв" loading="lazy">
        <figcaption>
          <h3>Гирлянда вместо гирлянды</h3>
          <p>Обычную новогоднюю гирлянду легко превратить в хэллоуинскую, если лампочки в форме тыкв — продаются отдельно, без остальной мишуры.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="decor-h-mantel.jpg" alt="Три резные тыквы разного размера на каминной полке" loading="lazy">
        <figcaption>
          <h3>Каминная полка</h3>
          <p>Если камина нет — тот же приём работает на любой полке или комоде: несколько тыкв разного размера, составленных вместе, выглядят как готовая композиция.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="decor-h-minimal.jpg" alt="Минималистичная композиция из тыквы, ветки и свечи" loading="lazy">
        <figcaption>
          <h3>Минимум вместо максимума</h3>
          <p>Не весь декор обязан быть ярким — тыква, сухая ветка и свеча в приглушённых тонах смотрятся не менее празднично, чем витрина магазина.</p>
        </figcaption>
      </figure>

    </div>
  </div>
