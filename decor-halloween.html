<main>

<section class="band" style="padding-top: clamp(3rem, 7vw, 5rem);">
  <div class="wrap">
    <p class="date-stamp">Оформление дома</p>
    <h1>Шесть идей для хэллоуинского декора</h1>
    <p class="lede">От крыльца до каминной полки — не обязательно делать всё сразу, достаточно одной-двух идей, чтобы дом почувствовал вечер.</p>

    <div class="decor-grid">

      <figure class="decor-card">
        <div class="decor-art">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Крыльцо с тыквами и гирляндой">
            <path d="M40,60 Q160,15 280,60" stroke="var(--muted)" fill="none" stroke-width="2"/>
            <circle cx="72" cy="52" r="4" fill="var(--accent2)"/>
            <circle cx="112" cy="35" r="4" fill="var(--accent2)"/>
            <circle cx="160" cy="30" r="4" fill="var(--accent2)"/>
            <circle cx="208" cy="35" r="4" fill="var(--accent2)"/>
            <circle cx="248" cy="52" r="4" fill="var(--accent2)"/>
            <polygon points="70,100 160,50 250,100" fill="var(--bg2)" stroke="var(--muted)" stroke-width="2"/>
            <rect x="85" y="100" width="150" height="90" fill="var(--bg2)" stroke="var(--muted)" stroke-width="2"/>
            <rect x="140" y="140" width="40" height="50" fill="var(--accent)"/>
            <rect x="98" y="120" width="22" height="22" fill="var(--accent2)" opacity=".55"/>
            <rect x="200" y="120" width="22" height="22" fill="var(--accent2)" opacity=".55"/>
            <circle cx="100" cy="195" r="13" fill="var(--accent)"/>
            <rect x="97" y="180" width="6" height="8" fill="var(--muted)"/>
            <circle cx="220" cy="195" r="13" fill="var(--accent)"/>
            <rect x="217" y="180" width="6" height="8" fill="var(--muted)"/>
            <line x1="20" y1="210" x2="300" y2="210" stroke="var(--muted)" stroke-width="2" opacity=".5"/>
          </svg>
        </div>
        <figcaption>
          <h3>Крыльцо и вход</h3>
          <p>Пара тыкв у двери и тёплая гирлянда над крыльцом работают лучше десятка мелких деталей — оформление видно уже с улицы.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <div class="decor-art">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Праздничный стол с тыквой в центре">
            <rect x="30" y="150" width="260" height="18" rx="6" fill="var(--bg2)" stroke="var(--muted)" stroke-width="2"/>
            <circle cx="75" cy="150" r="18" fill="none" stroke="var(--muted)" stroke-width="2"/>
            <circle cx="245" cy="150" r="18" fill="none" stroke="var(--muted)" stroke-width="2"/>
            <circle cx="160" cy="150" r="18" fill="none" stroke="var(--muted)" stroke-width="2"/>
            <circle cx="160" cy="118" r="30" fill="var(--accent)"/>
            <path d="M140,95 Q145,120 140,141 M160,90 Q163,120 160,146 M180,95 Q175,120 180,141" stroke="var(--bg)" stroke-width="2" fill="none" opacity=".35"/>
            <rect x="155" y="82" width="10" height="12" fill="var(--muted)"/>
            <rect x="98" y="92" width="8" height="42" fill="var(--accent2)"/>
            <path d="M98,92 Q102,80 106,92 Q102,86 98,92" fill="var(--accent)"/>
            <rect x="214" y="92" width="8" height="42" fill="var(--accent2)"/>
            <path d="M214,92 Q218,80 222,92 Q218,86 214,92" fill="var(--accent)"/>
          </svg>
        </div>
        <figcaption>
          <h3>Праздничный стол</h3>
          <p>Тёмная скатерть под приборы и одна крупная тыква в центре стола — любые оранжевые детали на таком фоне сразу читаются как тематические.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <div class="decor-art">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Светящаяся тыква на подоконнике">
            <defs>
              <filter id="glowH3" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="9"/>
              </filter>
            </defs>
            <rect x="70" y="30" width="180" height="160" rx="6" fill="none" stroke="var(--muted)" stroke-width="3"/>
            <line x1="160" y1="30" x2="160" y2="190" stroke="var(--muted)" stroke-width="2"/>
            <line x1="70" y1="110" x2="250" y2="110" stroke="var(--muted)" stroke-width="2"/>
            <circle cx="160" cy="125" r="62" fill="var(--accent)" opacity=".3" filter="url(#glowH3)"/>
            <circle cx="160" cy="130" r="50" fill="var(--accent)"/>
            <rect x="152" y="76" width="16" height="14" fill="var(--muted)"/>
            <polygon points="138,118 150,128 138,138" fill="var(--bg)"/>
            <polygon points="182,118 170,128 182,138" fill="var(--bg)"/>
            <path d="M135,150 Q160,168 185,150 L178,150 Q160,160 142,150 Z" fill="var(--bg)"/>
          </svg>
        </div>
        <figcaption>
          <h3>Светильник у окна</h3>
          <p>Один вырезанный фонарь на подоконнике, снятый в темноте, даёт больше атмосферы, чем гирлянда пластиковых украшений.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <div class="decor-art">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Гирлянда из тыкв и черепов">
            <path d="M20,75 Q60,25 100,75 Q140,125 180,75 Q220,25 260,75 Q280,100 300,90" stroke="var(--muted)" fill="none" stroke-width="2"/>
            <circle cx="20" cy="75" r="10" fill="var(--accent)"/>
            <circle cx="100" cy="75" r="10" fill="var(--accent2)"/>
            <circle cx="180" cy="75" r="10" fill="var(--accent)"/>
            <circle cx="260" cy="75" r="10" fill="var(--accent2)"/>
            <circle cx="60" cy="105" r="9" fill="var(--accent2)"/>
            <circle cx="140" cy="128" r="9" fill="var(--accent)"/>
            <circle cx="220" cy="105" r="9" fill="var(--accent2)"/>
            <circle cx="57" cy="103" r="1.6" fill="var(--bg)"/>
            <circle cx="63" cy="103" r="1.6" fill="var(--bg)"/>
            <circle cx="217" cy="103" r="1.6" fill="var(--bg)"/>
            <circle cx="223" cy="103" r="1.6" fill="var(--bg)"/>
          </svg>
        </div>
        <figcaption>
          <h3>Гирлянда вместо гирлянды</h3>
          <p>Обычную новогоднюю гирлянду легко превратить в хэллоуинскую, если заменить лампочки на тематические — продаются отдельно, без остальной мишуры.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <div class="decor-art">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Тыквы разных размеров на каминной полке">
            <rect x="20" y="150" width="280" height="16" rx="3" fill="var(--bg2)" stroke="var(--muted)" stroke-width="2"/>
            <circle cx="70" cy="128" r="18" fill="var(--accent)"/>
            <rect x="67" y="112" width="6" height="8" fill="var(--muted)"/>
            <circle cx="150" cy="115" r="26" fill="var(--accent)"/>
            <rect x="146" y="97" width="8" height="9" fill="var(--muted)"/>
            <circle cx="240" cy="102" r="32" fill="var(--accent)"/>
            <rect x="235" y="82" width="9" height="10" fill="var(--muted)"/>
            <path d="M108,140 Q112,120 116,140 Q112,132 108,140" fill="var(--accent2)"/>
            <path d="M195,132 Q199,112 203,132 Q199,124 195,132" fill="var(--accent2)"/>
          </svg>
        </div>
        <figcaption>
          <h3>Каминная полка</h3>
          <p>Если камина нет — приём работает на любой полке или комоде: несколько тыкв разного размера рядом выглядят как готовая композиция.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <div class="decor-art">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Минималистичный декор из тыквы и свечи">
            <path d="M20,175 C55,150 75,145 110,150" stroke="var(--muted)" fill="none" stroke-width="2"/>
            <line x1="45" y1="163" x2="52" y2="152" stroke="var(--muted)" stroke-width="2"/>
            <line x1="70" y1="152" x2="76" y2="140" stroke="var(--muted)" stroke-width="2"/>
            <line x1="95" y1="150" x2="100" y2="138" stroke="var(--muted)" stroke-width="2"/>
            <circle cx="165" cy="130" r="40" fill="var(--accent)"/>
            <rect x="159" y="87" width="12" height="14" fill="var(--muted)"/>
            <rect x="235" y="110" width="10" height="50" fill="var(--accent2)"/>
            <path d="M235,110 Q240,95 245,110 Q240,102 235,110" fill="var(--accent)"/>
          </svg>
        </div>
        <figcaption>
          <h3>Минимум вместо максимума</h3>
          <p>Не весь декор обязан быть ярким — тыква, сухая ветка и свеча в приглушённых тонах смотрятся не менее празднично, чем витрина магазина.</p>
        </figcaption>
      </figure>

    </div>
  </div>
</section>
