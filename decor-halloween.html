<main>

<section class="band" style="padding-top: clamp(3rem, 7vw, 5rem);">
  <div class="wrap">
    <p class="date-stamp">Оформление дома</p>
    <h1>Шесть идей для хэллоуинского декора</h1>
    <p class="lede">От крыльца до каминной полки — не обязательно делать всё сразу, достаточно одной-двух идей, чтобы дом почувствовал вечер.</p>

    <div class="decor-grid">

      <figure class="decor-card">
        <img src="https://images.unsplash.com/photo-1509557965875-b88c97052f0e?w=900&q=80&auto=format&fit=crop" alt="Скелеты и гирлянда с лампочками у входа в дом" loading="lazy">
        <figcaption>
          <h3>Крыльцо и вход</h3>
          <p>Пара скелетов у двери и тёплая гирлянда работают лучше десятка мелких деталей — гостям видно оформление уже с улицы.</p>
          <p class="decor-credit">Фото: <a href="https://unsplash.com/@heyquilia" target="_blank" rel="noopener">Quilia</a> / Unsplash</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="https://images.unsplash.com/photo-1727454145163-aad0eb3ff81c?w=900&q=80&auto=format&fit=crop" alt="Праздничный стол с хэллоуинским декором" loading="lazy">
        <figcaption>
          <h3>Праздничный стол</h3>
          <p>Чёрная скатерть или просто тёмная ткань под приборы — и любые оранжевые детали на ней сразу читаются как тематические.</p>
          <p class="decor-credit">Фото: <a href="https://unsplash.com/@shots_by_dima" target="_blank" rel="noopener">Dima Kaleganov</a> / Unsplash</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="https://images.unsplash.com/photo-1509558567730-6c838437b06b?w=900&q=80&auto=format&fit=crop" alt="Светящийся вырезанный светильник из тыквы" loading="lazy">
        <figcaption>
          <h3>Светильник у окна</h3>
          <p>Один вырезанный фонарь на подоконнике, снятый в темноте, даёт больше атмосферы, чем гирлянда пластиковых украшений.</p>
          <p class="decor-credit">Фото: <a href="https://unsplash.com/@heyquilia" target="_blank" rel="noopener">Quilia</a> / Unsplash</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="https://images.unsplash.com/photo-1573085139963-c8befdc59cfb?w=900&q=80&auto=format&fit=crop" alt="Гирлянда в форме тыкв на верёвке" loading="lazy">
        <figcaption>
          <h3>Гирлянда вместо гирлянды</h3>
          <p>Обычную новогоднюю гирлянду легко превратить в хэллоуинскую, если лампочки в форме тыкв или черепов — продаются отдельно, без остальной мишуры.</p>
          <p class="decor-credit">Фото: <a href="https://unsplash.com/@johnfold" target="_blank" rel="noopener">John Hayler</a> / Unsplash</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="https://images.unsplash.com/photo-1572978567882-408eb0787206?w=900&q=80&auto=format&fit=crop" alt="Тыквы и декор у камина" loading="lazy">
        <figcaption>
          <h3>Каминная полка</h3>
          <p>Если камина нет — тот же приём работает на любой полке или комоде: несколько тыкв разного размера, составленных вместе, выглядят как готовая композиция.</p>
          <p class="decor-credit">Фото: <a href="https://unsplash.com/@partyintheshire" target="_blank" rel="noopener">Erica Marsland Huynh</a> / Unsplash</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="https://images.unsplash.com/photo-1546702133-d1552256b03f?w=900&q=80&auto=format&fit=crop" alt="Минималистичный хэллоуинский декор" loading="lazy">
        <figcaption>
          <h3>Минимум вместо максимума</h3>
          <p>Не весь декор обязан быть ярким — тыква, пара сухих веток и свеча в приглушённых тонах смотрятся не менее празднично, чем витрина магазина.</p>
          <p class="decor-credit">Фото: <a href="https://unsplash.com/@marigard" target="_blank" rel="noopener">Bee Felten-Leidel</a> / Unsplash</p>
        </figcaption>
      </figure>

    </div>
  </div>
