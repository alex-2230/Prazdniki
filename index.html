<!DOCTYPE html>
<html lang="ru">
<head>

<title>Тридцать первое — Хэллоуин и Новый год</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="gate">

<header class="gate-top">
  <span class="mark">31&thinsp;/&thinsp;31</span>

<main class="gate-stage">
  <a class="side side-h" href="halloween.html">
    <span class="side-inner">

  <a class="side side-ny" href="newyear.html">

  <div class="numeral" aria-hidden="true">
    <span class="numeral-layer numeral-h">31</span>
    <span class="numeral-layer numeral-ny">31</span>

  <p class="gate-line">Два праздника выпадают на одно число. Выберите ночь.</p>

<footer class="gate-foot">
