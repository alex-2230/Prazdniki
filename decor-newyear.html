<body class="ny">

<main>

<section class="band" style="padding-top: clamp(3rem, 7vw, 5rem);">
  <div class="wrap">
    <p class="date-stamp">Оформление дома</p>
    <h1>Шесть идей для новогоднего декора</h1>
    <p class="lede">От ёлки до упаковки подарков — эти детали работают по отдельности, необязательно собирать их все в одном углу комнаты.</p>

    <div class="decor-grid">

      <figure class="decor-card">
        <div class="decor-art">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Крупные новогодние шары">
            <circle cx="115" cy="130" r="55" fill="var(--accent)"/>
            <circle cx="195" cy="105" r="44" fill="var(--accent2)"/>
            <circle cx="155" cy="172" r="34" fill="var(--text)" opacity=".85"/>
            <path d="M90,105 A50,50 0 0 1 130,95" stroke="var(--bg)" stroke-width="4" fill="none" opacity=".3"/>
            <path d="M175,80 A38,38 0 0 1 205,73" stroke="var(--bg)" stroke-width="3" fill="none" opacity=".3"/>
            <rect x="190" y="58" width="10" height="8" rx="2" fill="var(--muted)"/>
            <circle cx="195" cy="52" r="6" fill="none" stroke="var(--muted)" stroke-width="3"/>
          </svg>
        </div>
        <figcaption>
          <h3>Игрушки крупным планом</h3>
          <p>Несколько больших шаров одного размера смотрятся на ветках дороже, чем много мелких и разных — этим приёмом пользуются дизайнеры интерьеров.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <div class="decor-art">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Живая новогодняя ель">
            <polygon points="80,190 240,190 160,120" fill="var(--accent2)" opacity=".9"/>
            <polygon points="95,140 225,140 160,80" fill="var(--accent2)" opacity=".95"/>
            <polygon points="110,95 210,95 160,45" fill="var(--accent2)"/>
            <rect x="150" y="190" width="20" height="20" fill="var(--muted)"/>
            <polygon points="160,25 165,38 178,38 168,46 172,59 160,51 148,59 152,46 142,38 155,38" fill="var(--accent)"/>
            <circle cx="140" cy="160" r="4" fill="var(--accent)"/>
            <circle cx="182" cy="155" r="4" fill="var(--accent)"/>
            <circle cx="150" cy="112" r="4" fill="var(--accent)"/>
            <circle cx="172" cy="105" r="4" fill="var(--accent)"/>
            <circle cx="160" cy="70" r="4" fill="var(--accent)"/>
          </svg>
        </div>
        <figcaption>
          <h3>Живая ёлка</h3>
          <p>Даже без игрушек живая ель уже украшение сама по себе — запах хвои в комнате часто важнее любой мишуры.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <div class="decor-art">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Стол с шишками и свечами без блёсток">
            <rect x="30" y="150" width="260" height="18" rx="6" fill="var(--bg2)" stroke="var(--muted)" stroke-width="2"/>
            <ellipse cx="80" cy="128" rx="14" ry="24" fill="var(--muted)"/>
            <path d="M70,112 L90,112 M68,122 L92,122 M68,132 L92,132 M70,142 L90,142" stroke="var(--bg)" stroke-width="1.5" opacity=".4"/>
            <ellipse cx="235" cy="126" rx="14" ry="24" fill="var(--muted)"/>
            <path d="M225,110 L245,110 M223,120 L247,120 M223,130 L247,130 M225,140 L245,140" stroke="var(--bg)" stroke-width="1.5" opacity=".4"/>
            <rect x="150" y="95" width="8" height="55" fill="var(--accent2)"/>
            <path d="M150,95 Q154,80 158,95 Q154,87 150,95" fill="var(--accent)"/>
            <rect x="170" y="95" width="8" height="55" fill="var(--accent2)"/>
            <path d="M170,95 Q174,80 178,95 Q174,87 170,95" fill="var(--accent)"/>
            <polygon points="120,150 130,150 125,130" fill="var(--accent2)" opacity=".6"/>
            <polygon points="195,150 205,150 200,130" fill="var(--accent2)" opacity=".6"/>
          </svg>
        </div>
        <figcaption>
          <h3>Стол без блёсток</h3>
          <p>Шишки, веточки хвои и свечи выглядят празднично без единой золотой мишуры — природный декор почти никогда не выходит из моды.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <div class="decor-art">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Гирлянда на зеркальной раме">
            <rect x="60" y="40" width="200" height="140" rx="10" fill="none" stroke="var(--muted)" stroke-width="4"/>
            <rect x="72" y="52" width="176" height="116" rx="6" fill="var(--bg2)" opacity=".5"/>
            <path d="M60,58 Q160,15 260,58" stroke="var(--muted)" fill="none" stroke-width="2"/>
            <circle cx="95" cy="42" r="5" fill="var(--accent)"/>
            <circle cx="130" cy="24" r="5" fill="var(--accent2)"/>
            <circle cx="160" cy="19" r="5" fill="var(--accent)"/>
            <circle cx="190" cy="24" r="5" fill="var(--accent2)"/>
            <circle cx="225" cy="42" r="5" fill="var(--accent)"/>
          </svg>
        </div>
        <figcaption>
          <h3>Гирлянда не только на ёлке</h3>
          <p>Огоньки, обёрнутые вокруг зеркала, перил или горлышка вазы, работают как самостоятельный декор — ёлка для них не обязательна.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <div class="decor-art">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Подарочные коробки с лентами">
            <rect x="40" y="110" width="75" height="75" fill="var(--accent)"/>
            <line x1="77" y1="110" x2="77" y2="185" stroke="var(--bg)" stroke-width="6"/>
            <line x1="40" y1="147" x2="115" y2="147" stroke="var(--bg)" stroke-width="6"/>
            <rect x="130" y="85" width="85" height="100" fill="var(--accent2)"/>
            <line x1="172" y1="85" x2="172" y2="185" stroke="var(--bg)" stroke-width="6"/>
            <line x1="130" y1="135" x2="215" y2="135" stroke="var(--bg)" stroke-width="6"/>
            <polygon points="160,85 172,68 184,85" fill="var(--bg)"/>
            <rect x="225" y="125" width="55" height="60" fill="var(--muted)" opacity=".85"/>
            <line x1="252" y1="125" x2="252" y2="185" stroke="var(--bg)" stroke-width="5"/>
            <line x1="225" y1="155" x2="280" y2="155" stroke="var(--bg)" stroke-width="5"/>
          </svg>
        </div>
        <figcaption>
          <h3>Упаковка как часть декора</h3>
          <p>Подарки в одной цветовой гамме под ёлкой выглядят как продуманная композиция, даже если сама бумага была самой обычной.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <div class="decor-art">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Новогодние шары одного цвета">
            <circle cx="120" cy="140" r="34" fill="var(--accent2)"/>
            <circle cx="200" cy="105" r="28" fill="var(--accent2)" opacity=".85"/>
            <circle cx="165" cy="185" r="22" fill="var(--accent2)" opacity=".7"/>
            <circle cx="235" cy="165" r="18" fill="var(--accent2)" opacity=".6"/>
            <path d="M95,120 A40,40 0 0 1 130,108" stroke="var(--bg)" stroke-width="3" fill="none" opacity=".3"/>
            <rect x="196" y="72" width="8" height="7" rx="2" fill="var(--muted)"/>
            <circle cx="200" cy="66" r="5" fill="none" stroke="var(--muted)" stroke-width="2.5"/>
          </svg>
        </div>
        <figcaption>
          <h3>Один цвет вместо всех сразу</h3>
          <p>Белые и серебристые украшения без единого яркого пятна — вариант для тех, кому традиционный красно-золотой Новый год кажется слишком нарядным.</p>
        </figcaption>
      </figure>

    </div>
  </div>
</section>
