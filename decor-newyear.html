<body class="ny">

<main>

<section class="band" style="padding-top: clamp(3rem, 7vw, 5rem);">
  <div class="wrap">
    <p class="date-stamp">Оформление дома</p>
    <h1>Шесть идей для новогоднего декора</h1>
    <p class="lede">От ёлки до упаковки подарков — эти детали работают по отдельности, необязательно собирать их все в одном углу комнаты.</p>

    <div class="decor-grid">

      <figure class="decor-card">
        <img src="decor-ny-baubles.jpg" alt="Крупный план новогодних шаров на ёлке с гирляндой" loading="lazy">
        <figcaption>
          <h3>Игрушки крупным планом</h3>
          <p>Несколько больших шаров одного цвета смотрятся на ветках дороже, чем много мелких и разных — это правило дизайнеры интерьеров используют и для ёлки.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="decor-ny-tree.jpg" alt="Заснеженные ветки живой ели с огоньками на фоне" loading="lazy">
        <figcaption>
          <h3>Живая ёлка</h3>
          <p>Даже без игрушек живая ель уже украшение сама по себе — запах хвои в комнате часто важнее любой мишуры.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="decor-ny-table.jpg" alt="Новогодний стол с шишками, свечами и еловыми ветками" loading="lazy">
        <figcaption>
          <h3>Стол без блёсток</h3>
          <p>Шишки, веточки хвои и свечи на столе выглядят празднично без единой золотой мишуры — природный декор почти никогда не выходит из моды.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="decor-ny-garland.jpg" alt="Гирлянда с тёплыми огоньками на деревянных перилах лестницы" loading="lazy">
        <figcaption>
          <h3>Гирлянда не только на ёлке</h3>
          <p>Огоньки, обёрнутые вокруг перил или горлышка вазы, работают как самостоятельный декор — ёлка для них не обязательна.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="decor-ny-gifts.jpg" alt="Подарочные коробки в единой цветовой гамме под ёлкой" loading="lazy">
        <figcaption>
          <h3>Упаковка как часть декора</h3>
          <p>Подарки в одной цветовой гамме под ёлкой выглядят как продуманная композиция, даже если сама бумага была самой обычной.</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="decor-ny-white.jpg" alt="Белые и серебристые новогодние шары на заснеженной ветке" loading="lazy">
        <figcaption>
          <h3>Один цвет вместо всех сразу</h3>
          <p>Белые и серебристые украшения без единого яркого пятна — вариант для тех, кому традиционный красно-золотой Новый год кажется слишком нарядным.</p>
        </figcaption>
      </figure>

    </div>
  </div>
</section>
