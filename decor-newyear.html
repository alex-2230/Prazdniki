<main>

<section class="band" style="padding-top: clamp(3rem, 7vw, 5rem);">
  <div class="wrap">
    <p class="date-stamp">Оформление дома</p>
    <h1>Шесть идей для новогоднего декора</h1>
    <p class="lede">От ёлки до упаковки подарков — эти детали работают по отдельности, необязательно собирать их все в одном углу комнаты.</p>

    <div class="decor-grid">

      <figure class="decor-card">
        <img src="https://images.unsplash.com/photo-1482517967863-00e15c9b44be?w=900&q=80&auto=format&fit=crop" alt="Крупный план новогодних шаров на ёлке" loading="lazy">
        <figcaption>
          <h3>Игрушки крупным планом</h3>
          <p>Несколько больших шаров одного цвета смотрятся на ветках дороже, чем много мелких и разных — это правило дизайнеры интерьеров используют и для ёлки.</p>
          <p class="decor-credit">Фото: <a href="https://unsplash.com/@chadmadden" target="_blank" rel="noopener">Chad Madden</a> / Unsplash</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="https://images.unsplash.com/photo-1543258103-a62bdc069871?w=900&q=80&auto=format&fit=crop" alt="Живая новогодняя ель" loading="lazy">
        <figcaption>
          <h3>Живая ёлка</h3>
          <p>Даже без игрушек живая ель уже украшение сама по себе — запах хвои в комнате часто важнее любой мишуры.</p>
          <p class="decor-credit">Фото: <a href="https://unsplash.com/@t_rampersad" target="_blank" rel="noopener">Tessa Rampersad</a> / Unsplash</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="https://images.unsplash.com/photo-1514849543360-3228a8766079?w=900&q=80&auto=format&fit=crop" alt="Новогодний стол с шишками и природным декором" loading="lazy">
        <figcaption>
          <h3>Стол без блёсток</h3>
          <p>Шишки, веточки хвои и свечи на столе выглядят празднично без единой золотой мишуры — природный декор почти никогда не выходит из моды.</p>
          <p class="decor-credit">Фото: <a href="https://unsplash.com/@creatd" target="_blank" rel="noopener">Tyler Delgado</a> / Unsplash</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="https://images.unsplash.com/photo-1508172819040-536e3f54970f?w=900&q=80&auto=format&fit=crop" alt="Гирлянда с тёплыми огоньками" loading="lazy">
        <figcaption>
          <h3>Гирлянда не только на ёлке</h3>
          <p>Огоньки, обёрнутые вокруг зеркала, перил или горлышка вазы, работают как самостоятельный декор — ёлка для них не обязательна.</p>
          <p class="decor-credit">Фото: <a href="https://unsplash.com/@joannakosinska" target="_blank" rel="noopener">Joanna Kosinska</a> / Unsplash</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="https://images.unsplash.com/photo-1607619784547-07ac0be98721?w=900&q=80&auto=format&fit=crop" alt="Лента для упаковки подарков" loading="lazy">
        <figcaption>
          <h3>Упаковка как часть декора</h3>
          <p>Подарки в одной цветовой гамме под ёлкой выглядят как продуманная композиция, даже если сама бумага была самой обычной.</p>
          <p class="decor-credit">Фото: <a href="https://unsplash.com/@davies_designs" target="_blank" rel="noopener">Davies Designs Studio</a> / Unsplash</p>
        </figcaption>
      </figure>

      <figure class="decor-card">
        <img src="https://images.unsplash.com/photo-1508161250369-a7ecbdfb67fe?w=900&q=80&auto=format&fit=crop" alt="Белые новогодние шары и колокольчики" loading="lazy">
        <figcaption>
          <h3>Один цвет вместо всех сразу</h3>
          <p>Белые и серебристые украшения без единого яркого пятна — вариант для тех, кому традиционный красно-золотой Новый год кажется слишком нарядным.</p>
          <p class="decor-credit">Фото: <a href="https://unsplash.com/@joannakosinska" target="_blank" rel="noopener">Joanna Kosinska</a> / Unsplash</p>
        </figcaption>
      </figure>

    </div>
  </div>
</section>
